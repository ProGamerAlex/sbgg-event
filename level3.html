<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARG Puzzle - Level 3</title>
  <style>
    :root{
      --bg: #0b0d12;
      --bg2: #0a0a0a;
      --card: #111418;
      --text: #e9eef5;
      --muted: #9aa3ac;
      --field: #0f1216;
      --ring: rgba(139,92,246,.35);
      --primary: #8b5cf6;
      --primary-strong: #7c3aed;
      --shadow: 0 20px 60px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1000px 600px at 70% -20%, rgba(139,92,246,.15), transparent),
                  linear-gradient(180deg, var(--bg), var(--bg2) 60%);
      color: var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .container{
      display:flex;
      gap:24px;
      width: min(1200px, 95vw);
      flex-wrap: wrap;
    }

    .half{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction: column;
      min-width: 300px;
    }

    .card{
      width: 100%;
      max-width: 500px;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)) , var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 5vw, 40px);
      border: 1px solid rgba(255,255,255,.06);
    }

    h1{
      margin: 0 0 10px;
      font-size: clamp(28px, 4.6vw, 42px);
      font-weight: 800;
    }

    p.sub{
      margin: 0 0 24px;
      color: var(--muted);
      font-size: clamp(14px, 2.3vw, 18px);
    }

    .row{
      display:flex;
      gap: 14px;
      align-items:center;
    }

    input[type="text"]{
      flex:1;
      padding: 16px 18px;
      font-size: 18px;
      color: var(--text);
      background: var(--field);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      outline: none;
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    input::placeholder{ color: #6b7280; }
    input:focus{
      border-color: var(--ring);
      box-shadow: 0 0 0 6px var(--ring);
    }

    button.primary{
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 16px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform .05s ease, filter .2s ease, background .2s ease;
    }
    button.primary:active{ transform: translateY(1px); }
    button.primary:hover{ filter: brightness(1.05); background: var(--primary-strong); }

    #result{
      margin-top: 18px;
      font-size: 16px;
      min-height: 22px;
    }
    #result.ok{ color: #89ffa1; }
    #result.err{ color: #ff8888; }

    .media-box{
      width:100%;
      max-width:500px;
      height:auto;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)) , var(--card);
      border-radius:28px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.06);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px;
      flex-direction: column;
      gap: 20px;
    }

    /* Video links gallery */
    .video-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }
    .video-link {
      flex: 1 1 calc(50% - 12px);
      text-align: center;
      padding: 12px;
      background: #222;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .video-link:hover {
      background: #333;
    }

    /* Hint button */
    .hint-btn{
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color:white;
      font-size: 24px;
      border:none;
      cursor:pointer;
      z-index:1001;
    }

    .hint-popup{
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: #222;
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity:0;
      transition: opacity .3s ease;
      pointer-events:none;
      z-index:1001;
    }
    .hint-popup.show{ opacity: 1; pointer-events:auto; }
  </style>
</head>
<body>

  <button class="hint-btn" id="hintBtn" data-hint="Check the style of his movies for a clue!">?</button>
  <div id="hintPopup" class="hint-popup" aria-hidden="true"></div>

  <div class="container">

    <div class="half">
      <div class="card">
        <h1>Level 3: Tarantino</h1>
        <p class="sub">Enter the code word:</p>

        <div class="row">
          <input id="answer" type="text" placeholder="Type your answer here" autocomplete="off" />
          <button class="primary" id="submitBtn">Submit</button>
        </div>

        <div id="result" aria-live="polite"></div>
        <p class="sub" style="margin-top:16px">Tip: answers are case-insensitive.</p>
      </div>
    </div>

    <div class="half">
      <div class="media-box">
        <div class="video-gallery">
          <a href="https://m.youtube.com/watch?v=aCuAL7bZdtg" target="_blank" class="video-link">Video 1</a>
          <a href="https://www.youtube.com/watch?v=VIDEO_ID2" target="_blank" class="video-link">Video 2</a>
          <a href="https://youtu.be/19SIRwe2cX8?si=5Uw24t-GeoZXV-Zf" target="_blank" class="video-link">Video 3</a>
          <a href="https://m.youtube.com/watch?v=aCuAL7bZdtg" target="_blank" class="video-link">Video 4</a>
        </div>
      </div>
    </div>

  </div>

  <script>
    const CORRECT_WORD = "tarantino";
    const nextPage = "level4.html";

    const input = document.getElementById("answer");
    const btn = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    function check(){
      const val = (input.value || "").trim().toLowerCase();
      if(!val){ result.className = "err"; result.textContent = "Please enter something."; return; }
      if(val === CORRECT_WORD.toLowerCase()){
        result.className = "ok";
        result.textContent = "✓ Correct! Advancing...";
        setTimeout(()=> window.location.href = nextPage, 1000);
      } else {
        result.className = "err";
        result.textContent = "✗ Incorrect. Try again.";
      }
    }

    btn.addEventListener("click", check);
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") check(); });

    const hintBtn = document.getElementById("hintBtn");
    const hintPopup = document.getElementById("hintPopup");
    const HINT_DURATION_MS = 5000;
    const HINT_FADE_MS = 800;

    function showHint(){
      const text = hintBtn.getAttribute("data-hint") || "No hint set.";
      hintPopup.textContent = text;
      hintPopup.classList.add("show");
      hintPopup.setAttribute("aria-hidden","false");
      clearTimeout(showHint._hideTimer);
      showHint._hideTimer = setTimeout(()=>{
        hintPopup.style.opacity = "0";
        setTimeout(()=>{
          hintPopup.classList.remove("show");
          hintPopup.style.opacity = "";
          hintPopup.setAttribute("aria-hidden","true");
        }, HINT_FADE_MS);
      }, HINT_DURATION_MS);
    }
    hintBtn.addEventListener("click", showHint);
  </script>
</body>
</html>
